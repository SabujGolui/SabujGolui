<svg fill="none" viewBox="0 0 900 220" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        .container {
          width: 100%;
          height: 220px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          background: linear-gradient(135deg, #0d1117 0%, #161b22 45%, #0f172a 100%);
          border-radius: 16px;
          border: 1px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
          position: relative;
          overflow: hidden;
          text-align: center;
          padding: 20px 24px;
        }

        /* Ambient glowing circles in background */
        .glow-1 {
          position: absolute;
          width: 320px;
          height: 320px;
          top: -120px;
          left: -60px;
          background: radial-gradient(circle, rgba(56, 189, 248, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
          pointer-events: none;
          animation: float 8s ease-in-out infinite alternate;
        }

        .glow-2 {
          position: absolute;
          width: 340px;
          height: 340px;
          bottom: -140px;
          right: -60px;
          background: radial-gradient(circle, rgba(168, 85, 247, 0.18) 0%, rgba(0, 0, 0, 0) 70%);
          pointer-events: none;
          animation: float 9s ease-in-out infinite alternate-reverse;
        }

        @keyframes float {
          0% { transform: translate(0, 0) scale(1); }
          100% { transform: translate(30px, 20px) scale(1.15); }
        }

        .badge {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          background: rgba(56, 189, 248, 0.12);
          border: 1px solid rgba(56, 189, 248, 0.3);
          color: #38bdf8;
          font-size: 12px;
          font-weight: 600;
          letter-spacing: 0.06em;
          text-transform: uppercase;
          padding: 4px 14px;
          border-radius: 9999px;
          margin-bottom: 12px;
          backdrop-filter: blur(8px);
        }

        .badge-dot {
          width: 7px;
          height: 7px;
          border-radius: 50%;
          background-color: #38bdf8;
          box-shadow: 0 0 8px #38bdf8;
          animation: pulse 2s infinite;
        }

        @keyframes pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.4; transform: scale(0.85); }
        }

        .title {
          font-size: 34px;
          font-weight: 800;
          letter-spacing: -0.02em;
          background: linear-gradient(90deg, #ffffff 0%, #38bdf8 50%, #c084fc 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          margin-bottom: 8px;
          line-height: 1.2;
        }

        .subtitle {
          font-size: 15px;
          font-weight: 400;
          color: #94a3b8;
          max-width: 620px;
          line-height: 1.5;
        }

        .pills {
          display: flex;
          gap: 10px;
          margin-top: 14px;
          justify-content: center;
          flex-wrap: wrap;
        }

        .pill {
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.1);
          color: #cbd5e1;
          font-size: 11px;
          font-weight: 500;
          padding: 3px 10px;
          border-radius: 6px;
        }
      </style>

      <div class="container">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
        
        <div class="badge">
          <span class="badge-dot"></span>
          Full-Stack &amp; Cloud Developer
        </div>

        <h1 class="title">Sabuj Golui</h1>
        
        <p class="subtitle">
          Building thoughtful web experiences and practical cloud solutions.
        </p>

        <div class="pills">
          <span class="pill">React / Node.js</span>
          <span class="pill">PostgreSQL</span>
          <span class="pill">Azure &amp; GCP</span>
          <span class="pill">Docker &amp; DevOps</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
